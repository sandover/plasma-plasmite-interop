name: Prebuilt executables
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            name: macos-arm64
          - runner: macos-15-intel
            name: macos-x86_64
          - runner: ubuntu-22.04
            name: linux-x86_64
          - runner: ubuntu-22.04-arm
            name: linux-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config perl curl
      - name: Install build tools
        if: runner.os == 'macOS'
        run: brew install cmake pkgconf
      - name: Build, test, and package
        run: bash scripts/build-release.sh dist
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: plasticine-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* --verify-tag --title "Plasticine $TAG" \
            --notes 'Ready-to-run downloads for macOS and Linux, including ARM64 Raspberry Pi. Each archive includes its libraries and license notices. See the README for installation and usage.'
